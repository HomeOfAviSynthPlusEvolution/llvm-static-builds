name: Build static LLVM SDKs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llvm-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows, arch: x86, runner: windows-2025-vs2026, jobs: 4}
          - {os: windows, arch: x64, runner: windows-2025-vs2026, jobs: 4}
          - {os: windows, arch: arm64, runner: windows-11-vs2026-arm, jobs: 4}
          - {os: macos, arch: x64, runner: macos-15-intel, jobs: 4}
          - {os: macos, arch: arm64, runner: macos-15, jobs: 3}
    env:
      SDK_ARCH: ${{ matrix.arch }}
      SDK_PLATFORM: ${{ matrix.os }}
      SDK_JOBS: ${{ matrix.jobs }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Configure MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/msvc-env.ps1
      - name: Install pinned clang-cl
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-clang.ps1
      - name: Select Xcode
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(python3 -c 'import json; print(json.load(open("build-config.json"))["xcode_version"])')
          sudo xcode-select --switch "/Applications/Xcode_${version}.app/Contents/Developer"
          xcodebuild -version
      - name: Install Ninja
        run: python -m pip install ninja==1.13.0
      - name: Build, relocate, test, and package
        run: python scripts/build.py --platform ${{ env.SDK_PLATFORM }} --arch ${{ env.SDK_ARCH }} --jobs ${{ env.SDK_JOBS }}
      - name: Upload SDK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: llvm-static-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: diagnostics-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            work/logs/
            work/llvm-build/CMakeCache.txt
            work/components/components.txt
            work/smoke-build/CMakeCache.txt
            work/relocated/*/lib/cmake/llvm/LLVMConfig.cmake
          if-no-files-found: ignore
          retention-days: 14
